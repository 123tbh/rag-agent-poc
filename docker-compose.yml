# RAG + Agent 演示服务：api（FastAPI）+ ui（Gradio）+ postgres（pgvector 向量库）
services:
  api:
    build: .
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_DATABASE=ragdemo
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: .
    command: python ui.py
    ports:
      - "7860:7860"
    env_file: .env
    environment:
      - API_URL=http://api:8000
      - UI_PORT=7860
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdemo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdemo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: